name: Build and Release Mobile Apps (APK & IPA)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor Android
        working-directory: mobile
        run: npx cap sync android

      - name: Build Android APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ilo4-remote-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS Sideloadable IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install Dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor iOS
        working-directory: mobile
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: mobile/ios/App
        run: pod install

      - name: Build iOS Archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Sideloadable IPA
        working-directory: mobile/ios/App
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r ilo4-remote-unsigned.ipa Payload
          cd ../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ilo4-remote-ios-ipa
          path: mobile/ios/App/build/ilo4-remote-unsigned.ipa

  release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: ilo4-remote-android-apk
          path: artifacts/

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ilo4-remote-ios-ipa
          path: artifacts/

      - name: Rename Files
        run: |
          mv artifacts/app-debug.apk artifacts/ilo4-remote-${{ github.ref_name }}.apk
          mv artifacts/ilo4-remote-unsigned.ipa artifacts/ilo4-remote-${{ github.ref_name }}.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ilo4-remote-${{ github.ref_name }}.apk
            artifacts/ilo4-remote-${{ github.ref_name }}.ipa
          draft: false
          prerelease: false
          generate_release_notes: true
